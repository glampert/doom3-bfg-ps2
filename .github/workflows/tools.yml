# Builds the C++ host tools (src/tools/CMakeLists.txt) optimized and with warnings as errors,
# with each compiler they support: GCC on Linux, Apple clang on macOS, MSVC on Windows.
#
# The game is built by ps2.yml, inside the ps2dev toolchain's container image. This workflow
# runs when the tools or their CMake project change, or the engine sources the script cook
# builds (idlib, id's script compiler and the backend files it links). Each host then cooks the
# authored script fixtures, and the last job requires all three to write the same images: the
# retail program can only be cooked where a retail installation is, so this is what holds a
# Linux, macOS or Windows cook to one program.

name: Host tools

on:
  push:
    paths:
      - 'src/tools/CMakeLists.txt'
      - 'src/tools/assets/**'
      - 'src/tools/asset_reexport/**'
      - 'src/tools/resource_unpack/**'
      - 'src/tools/script_cook/**'
      - 'src/neo/idlib/**'
      - 'src/neo/d3xp/script/**'
      - 'src/neo/framework/**'
      - 'src/neo/sys/sys_public.h'
      - 'src/ps2/common.h'
      - 'src/ps2/game/script_error.*'
      - 'src/ps2/game/script_image_format.h'
      - 'src/ps2/system/heap.h'
      - 'src/ps2/system/log.*'
      - 'src/tests/data/headless/base/script/**'
      - 'src/tests/data/headless_map/script/**'
      - '.github/workflows/tools.yml'
  pull_request:
    paths:
      - 'src/tools/CMakeLists.txt'
      - 'src/tools/assets/**'
      - 'src/tools/asset_reexport/**'
      - 'src/tools/resource_unpack/**'
      - 'src/tools/script_cook/**'
      - 'src/neo/idlib/**'
      - 'src/neo/d3xp/script/**'
      - 'src/neo/framework/**'
      - 'src/neo/sys/sys_public.h'
      - 'src/ps2/common.h'
      - 'src/ps2/game/script_error.*'
      - 'src/ps2/game/script_image_format.h'
      - 'src/ps2/system/heap.h'
      - 'src/ps2/system/log.*'
      - 'src/tests/data/headless/base/script/**'
      - 'src/tests/data/headless_map/script/**'
      - '.github/workflows/tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC, Ubuntu (latest)
            os: ubuntu-latest
          - name: Apple clang, macOS (latest)
            os: macos-latest
          - name: MSVC, Windows (latest)
            os: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S src/tools -B build/tools
      # --config picks Release under Visual Studio, which builds every config from one
      # tree. The other generators already have it from CMakeLists.txt.
      - name: Build
        run: cmake --build build/tools --config Release --parallel
      # The Windows executables, for people who don't build the tools themselves. They are
      # listed on the run's page (GitHub sign-in needed to download) and kept for 90 days.
      - name: Upload the Windows executables
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: host-tools-windows-x64
          path: build/tools/Release/*.exe
          if-no-files-found: error
      # The cross-host fixture (src/tools/script_cook/tests) and the two headless packages'
      # programs; a Windows checkout's CRLF line endings cook the same images.
      - name: Cook the script fixtures
        shell: bash
        run: |
          cook=build/tools/script_cook
          if [ "$RUNNER_OS" = Windows ]; then cook=build/tools/Release/script_cook.exe; fi
          mkdir -p build/script-images
          for fixture in src/tools/script_cook/tests src/tests/data/headless/base src/tests/data/headless_map; do
            "$cook" --events src/tools/script_cook/events.txt --source-dir "$fixture" \
              --output "build/script-images/$(echo "${fixture#src/}" | tr / _).d3sp" | grep -v SCRIPT_CENSUS
          done
      - name: Upload the script images
        uses: actions/upload-artifact@v7
        with:
          name: script-images-${{ runner.os }}
          path: build/script-images/
          if-no-files-found: error
          retention-days: 7

  script-images:
    name: Script images agree across hosts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: script-images-*
      - name: Compare with the Linux images
        run: |
          sha256sum script-images-*/*.d3sp
          status=0
          for image in script-images-Linux/*.d3sp; do
            name=$(basename "$image")
            for host in macOS Windows; do
              if ! cmp "$image" "script-images-$host/$name"; then
                echo "::error::$host cooks a different $name"
                status=1
              fi
            done
          done
          exit $status
